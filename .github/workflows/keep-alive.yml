name: Keep Streamlit app awake

on:
  schedule:
    # Every 3 hours — well inside Streamlit Community Cloud's inactivity
    # threshold, so the app never hibernates in the first place.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app
        run: |
          curl -fsSL --max-time 60 --retry 3 --retry-delay 5 \
            https://semibot-raj.streamlit.app/ \
            -A "GitHub-Actions-Keepalive" \
            -o /dev/null
          echo "Pinged SemiBot OK at $(date -u)"
